services:
  postgres:
    image: postgres:17
    container_name: australia-auto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - australia_auto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - australia-auto-network

  redis:
    image: redis:8
    container_name: australia-auto-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - australia_auto_redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - australia-auto-network

networks:
  australia-auto-network:
    name: australia-auto-network

volumes:
  australia_auto_postgres_data:
    name: australia-auto-postgres-data

  australia_auto_redis_data:
    name: australia-auto-redis-data
